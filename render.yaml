services:
  - type: web
    name: wayfarer-rpg
    runtime: docker
    plan: free
    branch: rework
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
